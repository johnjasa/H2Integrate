name: "technology_config"
description: "This plant has wind feeding into an electrolyzer with optimization"

technologies:
  wind:
    performance_model:
      model: "wind_plant_performance"
    cost_model:
      model: "wind_plant_cost"
    model_inputs:
      shared_parameters:
        num_turbines: 1
        turbine_rating_kw: 1500.0
      performance_parameters:
        rotor_diameter: 77.
        hub_height: 80.
        layout_mode: "basicgrid"
        model_name: "pysam"
        model_input_file: null
        layout_params:
          row_D_spacing: 10.
          turbine_D_spacing: 10.
        rating_range_kw: [1000, 5000]
        floris_config: null
        operational_losses: 10.0
        timestep: [1, 60]
        fin_model: "default"
        name: "UtilityScaleWindPlant"
        turbine_name: "DOE_GE_1.5MW_77" #turbine model to use
        turbine_group: "onshore"
        override_wind_resource_height: False
        adjust_air_density_for_elevation: True
      cost_parameters:
        cost_per_kw: 1100.0
        cost_year: 2019
  solar:
    performance_model:
      model: "pysam_solar_plant_performance"
    cost_model:
      model: "atb_utility_pv_cost"
    model_inputs:
      performance_parameters:
        pv_capacity_kWdc: 1000.0
        dc_ac_ratio: 1.34
        create_model_from: "new"
        tilt_angle_func: "none"
        tilt: 0
        pysam_options:
          SystemDesign:
            gcr: 0.3
            array_type: 2
            bifaciality: 0.65
            inv_eff: 96.0
            losses: 14.6
            module_type: 1
            azimuth: 180
            rotlim: 45
          SolarResource:
            albedo_default: 0.2
      cost_parameters:
        capex_per_kWac: 1193
        opex_per_kWac_per_year: 18
        cost_year: 2024
  combiner:
    performance_model:
      model: "combiner_performance"
    model_inputs:
      performance_parameters:
        commodity: "electricity"
        commodity_units: "kW"
  battery:
    performance_model:
      model: "simple_generic_storage"
    cost_model:
      model: "atb_battery_cost"
    control_strategy:
      model: "demand_open_loop_controller"
    model_inputs:
      shared_parameters:
        commodity_name: "electricity"
        commodity_units: "kW"
        max_charge_rate: 500.0  # kW (roughly half of wind capacity)
        max_capacity: 4000.0  # kWh (4 hours of storage at max charge rate)
      control_parameters:
        max_charge_percent: 1.0  # percent as decimal
        min_charge_percent: 0.1  # percent as decimal
        init_charge_percent: 0.25  # percent as decimal
        max_discharge_rate: 8000.0  # kW
        charge_efficiency: 0.95 # percent as decimal
        discharge_efficiency: 0.95 # percent as decimal
        demand_profile: 1000. # kW (electrolyzer capacity)
      cost_parameters:
        cost_year: 2022
        energy_capex: 250 # $/kWh
        power_capex: 40 # $/kW
        opex_fraction: 0.02 # percent of capex
  electrolyzer:
    performance_model:
      model: "wombat"
    cost_model:
      model: "wombat"
    model_inputs:
      shared_parameters:
        location: "onshore"
        electrolyzer_capex: 1000  # $/kW
        sizing:
          resize_for_enduse: False
          size_for: 'BOL' #'BOL' (generous) or 'EOL' (conservative)
          hydrogen_dmd:
        n_clusters: 1
        cluster_rating_MW: 1
        pem_control_type: 'basic'
        eol_eff_percent_loss: 13 #eol defined as x% change in efficiency from bol
        uptime_hours_until_eol: 80000. #number of 'on' hours until electrolyzer reaches eol
        include_degradation_penalty: True #include degradation
        turndown_ratio: 0.1 #turndown_ratio = minimum_cluster_power/cluster_rating_MW
        library_path: "resource_files/wombat_library"
        filepath: "project/config/base.yaml"
        cost_year: 2022
      financial_parameters:
        capital_items:
          depr_period: 7 # based on PEM Electrolysis H2A Production Case Study Documentation estimate of 7 years. also see https://www.irs.gov/publications/p946#en_US_2020_publink1000107507
          replacement_cost_percent: 0.15 # percent of capex - H2A default case
