name: H2Integrate_config
system_summary: >
  Solar and a merchant battery added to an existing wind and solar plant in west
  Texas. A rolling-horizon mixed-integer program co-optimizes battery dispatch,
  grid imports, and exports against hourly prices, while a parameter sweep
  traces net present value, including recovered existing spill, against battery
  energy capacity. Exports are limited by the grid interconnection.
driver_config: driver_config.yaml
plant_config: plant_config.yaml
technology_config: tech_config.yaml
