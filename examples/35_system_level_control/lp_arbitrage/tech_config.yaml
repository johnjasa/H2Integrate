name: technology_config
description: >
  Solar and a battery added to an existing wind and solar plant, with separate
  grid connections for imports and exports. Both grid price series are
  overridden with an hourly LMP profile in the run script.
technologies:
  added_solar:
    performance_model:
      model: PYSAMSolarPlantPerformanceModel
    cost_model:
      model: ATBUtilityPVCostModel
    model_inputs:
      performance_parameters:
        pv_capacity_kWdc: 50000
        dc_ac_ratio: 1.3
        create_model_from: default
        config_name: PVWattsSingleOwner
        tilt_angle_setting: lat-func
        pysam_options:
          SystemDesign:
            inv_eff: 96.0
            module_type: 0
            losses: 14.08
          Lifetime:
            dc_degradation: [0]
      cost_parameters:
        capex_per_kWac: 900
        opex_per_kWac_per_year: 15
        cost_year: 2022
  battery:
    performance_model:
      model: StoragePerformanceModel
    cost_model:
      model: GenericStorageCostModel
    model_inputs:
      shared_parameters:
        commodity: electricity
        commodity_rate_units: kW
        max_charge_rate: 50000  # 50 MW
        max_capacity: 200000  # 200 MWh (4-hour battery)
        init_soc_fraction: 0.5
        max_soc_fraction: 1.0
        min_soc_fraction: 0.1
      performance_parameters:
        round_trip_efficiency: 0.88
        demand_profile: 0.
      cost_parameters:
        cost_year: 2022
        capacity_capex: 310
        charge_capex: 311
        opex_fraction: 0.025
  grid_buy:
    performance_model:
      model: GridPerformanceModel
    cost_model:
      model: GridCostModel
    model_inputs:
      shared_parameters:
        interconnection_size: 50000.  # 50 MW import limit
      cost_parameters:
        cost_year: 2024
        electricity_buy_price: 0.03  # $/kWh; overridden with an LMP series in the run script
        buy_price_mode: per_timestep
        interconnection_capex_per_kw: 0.0
        interconnection_opex_per_kw: 0.0
        fixed_interconnection_cost: 0.0
  grid_sell:
    performance_model:
      model: GridPerformanceModel
    cost_model:
      model: GridCostModel
    model_inputs:
      shared_parameters:
        interconnection_size: 100000.  # 100 MW export limit
      cost_parameters:
        cost_year: 2024
        electricity_sell_price: 0.03  # $/kWh; overridden with an LMP series in the run script
        sell_price_mode: per_timestep
        interconnection_capex_per_kw: 0.0
        interconnection_opex_per_kw: 0.0
        fixed_interconnection_cost: 0.0
  charge_combiner:
    performance_model:
      model: GenericCombinerPerformanceModel
    model_inputs:
      performance_parameters:
        commodity: electricity
        commodity_rate_units: kW
        in_streams: 3  # grid imports + the existing plant's spill + added solar
  out_combiner:
    performance_model:
      model: GenericCombinerPerformanceModel
    model_inputs:
      performance_parameters:
        commodity: electricity
        commodity_rate_units: kW
        in_streams: 2  # aggregated source bus + battery net output
  electrical_load_demand:
    performance_model:
      model: GenericDemandComponent
    model_inputs:
      performance_parameters:
        commodity: electricity
        commodity_rate_units: kW
        demand_profile: 0.  # merchant plant: no on-site load, everything is exported
  existing_combiner:
    performance_model:
      model: GenericCombinerPerformanceModel
    model_inputs:
      performance_parameters:
        commodity: electricity
        commodity_rate_units: kW
        in_streams: 2
  # --- Existing plant, listed under uncontrolled_components so the controller
  # --- neither dispatches it nor counts its output as available supply.
  existing_wind:
    performance_model:
      model: PYSAMWindPlantPerformanceModel
    cost_model:
      model: ATBWindPlantCostModel
    model_inputs:
      performance_parameters:
        num_turbines: 20
        turbine_rating_kw: 6000
        hub_height: 115
        rotor_diameter: 170
        create_model_from: default
        config_name: WindPowerSingleOwner
        pysam_options:
          Farm:
            wind_farm_wake_model: 0
          Losses:
            ops_strategies_loss: 10.0
        layout:
          layout_mode: basicgrid
          layout_options:
            row_D_spacing: 5.0
            turbine_D_spacing: 5.0
            rotation_angle_deg: 0.0
            row_phase_offset: 0.0
            layout_shape: square
      cost_parameters:
        capex_per_kW: 1300
        opex_per_kW_per_year: 39
        cost_year: 2022
  existing_solar:
    performance_model:
      model: PYSAMSolarPlantPerformanceModel
    cost_model:
      model: ATBUtilityPVCostModel
    model_inputs:
      performance_parameters:
        pv_capacity_kWdc: 150000  # 150 MWdc
        dc_ac_ratio: 1.3
        create_model_from: default
        config_name: PVWattsSingleOwner
        tilt_angle_setting: lat-func
        pysam_options:
          SystemDesign:
            inv_eff: 96.0
            module_type: 0
            losses: 14.08
          Lifetime:
            dc_degradation: [0]
      cost_parameters:
        capex_per_kWac: 900
        opex_per_kWac_per_year: 15
        cost_year: 2024
  existing_load_demand:
    performance_model:
      model: GenericDemandComponent
    model_inputs:
      performance_parameters:
        commodity: electricity
        commodity_rate_units: kW
        demand_profile: 60000.  # 60 MW flat load
