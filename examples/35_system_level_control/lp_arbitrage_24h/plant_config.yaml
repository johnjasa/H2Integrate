name: plant_config
description: >
  A synthetic solar plant and battery share a bus with separate grid import and
  export connections. The example solves one 24-hour controller window; the
  configured plant horizon is one year as required by H2Integrate.
technology_interconnections:
  - [grid_buy, charge_combiner, electricity, cable]
  - [solar, charge_combiner, electricity, cable]
  - [charge_combiner, battery, electricity, cable]
  - [charge_combiner, output_combiner, electricity, cable]
  - [battery, output_combiner, electricity, cable]
  - [output_combiner, electrical_load_demand, electricity, cable]
  - [electrical_load_demand, grid_sell, [unused_electricity_out, electricity_set_point]]
  - [electrical_load_demand, grid_sell, [unused_electricity_out, electricity_in]]
plant:
  plant_life: 30
  simulation:
    n_timesteps: 8760
    dt: 3600
system_level_control:
  control_strategy: LPArbitrageControl
  demand_component: electrical_load_demand
  export_component: grid_sell
  control_parameters:
    n_control_window_hours: 24
    n_commit_window_hours: 24
    cost_per_tech:
      grid_buy: buy_price
    storage_cycle_cost: 0.001
    solver_name: glpk
  solver_options:
    solver_name: gauss_seidel
    max_iter: 30
    convergence_tolerance: 1.0e-10
    solver_option_kwargs:
      use_aitken: true
